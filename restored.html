            height: 100vh;
        }
        #layout {
            display: grid;
            grid-template-columns: 45% 55%;
            height: 100vh;
            width: 100vw;
        }
        #code-panel {
            background: #0f0f0f;
            border-right: 1px solid #333;
            padding: 12px;
            overflow: auto;
        }
        #code-view {
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 12px;
        }
        .code-line {
            display: flex;
            gap: 12px;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .code-line:hover {
            background: #1c1c1c;
        }
        .code-line.selected {
            background: #2b4a6d;
        }
        .line-no {
            color: #666;
            min-width: 42px;
            text-align: right;
            user-select: none;
        }
        .line-text {
            color: #ddd;
            white-space: pre;
        }
        #graph-panel {
            position: relative;
            background: #1e1e1e;
            overflow: hidden;
        }
        #inspector-panel {
            position: absolute;
            top: 180px;
            left: 10px;
            width: 280px;
            max-height: calc(100% - 200px);
            overflow: auto;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        #detail-panel {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 320px;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .panel-title {
            font-size: 13px;
            font-weight: bold;
            color: #8ab4f8;
            margin-bottom: 8px;
        }
        .panel-section {
            margin-bottom: 12px;
        }
        .panel-label {
            display: block;
            font-size: 11px;
            color: #bbb;
            margin-bottom: 6px;
        }
        .panel-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .panel-row.small {
            font-size: 11px;
            color: #aaa;
        }
        #search-input {
            width: 100%;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #111;
            color: #eee;
        }
        #node-list {
            max-height: 240px;
            overflow: auto;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 6px;
            background: #151515;
        }
        #detail-content {
            white-space: pre-wrap;
        }
        .node-item {
            padding: 4px 6px;
            margin-bottom: 2px;
            cursor: pointer;
            border-radius: 3px;
        }
        .node-item:hover {
            background: #222;
        }
        .node-item.selected {
            background: #2b4a6d;
        }
        .panel-actions button {
            background: #007acc;
            color: white;
            border: none;
            padding: 4px 8px;
            margin-right: 6px;
            border-radius: 3px;
            cursor: pointer;
        }
        .panel-actions button:hover {
            background: #005a9e;
        }
        .small {
            font-size: 11px;
            color: #bbb;
        }
        #graph-container {
            width: 100%;
            height: 100%;
            overflow: auto;
        }
        svg {
            background: #1e1e1e;
            display: block;
        }
        .node {
            cursor: pointer;
        }
        .node.selected circle {
            stroke: #ffb300;
            stroke-width: 4px;
        }
        .node.match circle {
            stroke: #fdd835;
            stroke-width: 3px;
        }
        .node.dim {
            opacity: 0.2;
        }
        .node.hidden {
            display: none;
        }
        .node.scope {
            cursor: pointer;
        }
        .node.scope:hover {
            opacity: 0.8;
        }
        .node-label {
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 11px;
            pointer-events: none;
            fill: #fff;
        }
        .node.scope .node-label {
            font-weight: bold;
            font-size: 12px;
            fill: #fff;
        }
        .link {
            fill: none;
            stroke: #666;
            stroke-width: 1.5px;
        }
        .link.highlight {
            stroke: #ffb300;
            stroke-width: 3px;
        }
        .link.dim {
            opacity: 0.15;
        }
        .link.hidden {
            display: none;
        }
        .link.scope-link {
            stroke: #007acc;
            stroke-width: 2px;
        }
        .link.push-link {
            stroke: #42a5f5;
        }
        .link.pop-link {
            stroke: #66bb6a;
        }
    </style>
</head>

        const sourceCode = "from dataclasses import dataclass, field\nfrom typing import Any, Dict, List, NamedTuple, Optional, Tuple\nfrom tree_sitter import Parser, Language, QueryCursor,Query\nimport tree_sitter_python as tspython\n\nfrom src.visualizer import visualize_graph\nfrom src.captures import CapturesManager\nfrom src.graph import GraphBuilder\n\n# Setup\n\n# Code to parse\ncode = \"\"\"  \n\nclass A():\n    x = 10\n    def method_a(self):\n        pass\n    \nclass B(A):\n    def method_b(self):\n        return self.x\n\ndef main():\n    b = B()\n    a = b.method_b()\n\n\"\"\"\n\n\nmanager = CapturesManager(\"python\")\nparser = Parser(manager.LANGUAGE)\ntree = parser.parse(code.encode(\"utf8\"))\n\n\n# 3. Esecuzione Query (Veloce)\nsorted_captures = manager.execute(tree.root_node)\nhandler_map = manager.get_handlers()\n\nprint(tree.root_node)\n\n# 4. Debug: Stampa le catture ordinate\nfor node, capture_name in sorted_captures:\n    print(f\"Capture: {capture_name} at {node.byte_range}\")\n\n\nbuilder_instance = GraphBuilder()   \n\nroots = builder_instance.build(sorted_captures, handler_map)\n\nvisualize_graph(roots)";
        const sourcePath = "main.py";
        const graphPanel = document.getElementById("graph-panel");
        const graphContainer = document.getElementById("graph-container");
        const parentIdsByNode = new Map();

                parentIdsByNode.set(edge.target, []);
            }
            parentIdsByNode.get(edge.target).push(edge.source);

        // Node and link arrays for D3
        let nodes = [];

        let selectedNodeId = null;
        let matchIds = new Set();

            PUSH: true,
            POP: true,
            OTHER: true
        };
        let nodeSelection = null;
        let linkSelection = null;

        let codeLineElements = [];
        let graphWidth = 0;
        let graphHeight = 0;

        // Initialize: load all nodes and edges
        function initializeGraph() {
            nodes = graphData.nodes.map(n => {
                const depth = Number.isFinite(n.depth) ? n.depth : 0;
                return { ...n, depth };
            });
            nodeById = new Map(nodes.map(n => [n.id, n]));
            links = graphData.edges.map(e => ({
                source: nodeById.get(e.source),
                target: nodeById.get(e.target)
            })).filter(link => link.source && link.target);

        function nodeMatchesFilter(node) {
            if (node.type === 'SCOPE') return filters.SCOPE;
            if (node.type === 'PUSH') return filters.PUSH;
            if (node.type === 'POP') return filters.POP;
            return filters.OTHER;
        }

        function applySearch(term) {
            const lowerTerm = term.trim().toLowerCase();
            matchIds.clear();
            if (!lowerTerm) {
                updateNodeList();
                updateGraphStyles();
                return;
            }

            nodes.forEach(node => {
                const sym = (node.symbol || '').toLowerCase();
                const ctx = (node.ctx || '').toLowerCase();
                if (sym.includes(lowerTerm) || ctx.includes(lowerTerm)) {
                    matchIds.add(node.id);
                }
            });
            updateNodeList();
            updateGraphStyles();
        }

        function updateNodeList() {
            const list = document.getElementById("node-list");
            const count = document.getElementById("node-count");
            if (!list || !count) return;

            const filtered = nodes.filter(n => nodeMatchesFilter(n));
            const listed = matchIds.size === 0 ? filtered : filtered.filter(n => matchIds.has(n.id));
            const totalText = matchIds.size === 0
                ? `${listed.length} nodes`
                : `${listed.length} of ${filtered.length} nodes`;
            count.textContent = totalText;

            list.innerHTML = "";
            listed.slice(0, 500).forEach(node => {
                const item = document.createElement("div");

                item.textContent = `${node.symbol} (${node.type})`;

                };
                list.appendChild(item);
            });
        }

        function buildCodeView() {
            const codeView = document.getElementById("code-view");
            const codeMeta = document.getElementById("code-meta");
            if (!codeView) return;

            if (codeMeta) {
                codeMeta.textContent = sourcePath || "Source";
            }

            if (!sourceCode) {
                codeView.textContent = "No source provided.";
                return;
            }

            const encoder = new TextEncoder();
            const lines = sourceCode.split("\n");
            let byteOffset = 0;
            codeLineMeta = [];
            codeLineElements = [];
            codeView.innerHTML = "";

            lines.forEach((line, index) => {
                const lineBytes = encoder.encode(line);
                const start = byteOffset;
                const end = start + lineBytes.length;
                byteOffset = end + (index < lines.length - 1 ? 1 : 0);
                codeLineMeta.push({ start, end });

                const lineEl = document.createElement("div");
                lineEl.className = "code-line";
                lineEl.dataset.line = String(index + 1);
                lineEl.dataset.start = String(start);
                lineEl.dataset.end = String(end);

                const numberEl = document.createElement("span");
                numberEl.className = "line-no";
                numberEl.textContent = String(index + 1);

                const textEl = document.createElement("span");
                textEl.className = "line-text";
                textEl.textContent = line === "" ? " " : line;

                lineEl.append(numberEl, textEl);
                lineEl.addEventListener("click", () => {
                    selectNodeFromLine(index);
                });

                codeView.appendChild(lineEl);
                codeLineElements.push(lineEl);
            });
        }

        function findLineForByte(byteOffset) {
            if (!codeLineMeta.length) return null;
            for (let i = 0; i < codeLineMeta.length; i++) {
                const meta = codeLineMeta[i];
                if (byteOffset <= meta.end) {
                    return i;
                }
            }
            return codeLineMeta.length - 1;
        }

        function highlightCodeForNode(node) {
            if (!codeLineElements.length) return;
            codeLineElements.forEach(el => el.classList.remove("selected"));
            if (!node) return;

            let firstIndex = null;
            for (let i = 0; i < codeLineMeta.length; i++) {
                const meta = codeLineMeta[i];
                const overlaps = meta.start <= node.end_byte && meta.end >= node.start_byte;
                if (overlaps) {
                    codeLineElements[i].classList.add("selected");
                    if (firstIndex === null) firstIndex = i;
                }
            }

            if (firstIndex !== null) {
                codeLineElements[firstIndex].scrollIntoView({ block: "center" });
            }
        }

        function selectNodeFromLine(lineIndex) {
            if (!codeLineMeta.length) return;
            const meta = codeLineMeta[lineIndex];
            if (!meta) return;
            const candidates = nodes.filter(n => n.start_byte <= meta.end && n.end_byte >= meta.start);
            if (candidates.length === 0) return;

            let best = candidates[0];
            candidates.forEach(candidate => {
                const size = candidate.end_byte - candidate.start_byte;
                const bestSize = best.end_byte - best.start_byte;
                if (size < bestSize) {
                    best = candidate;
                }
            });

            selectNode(best);
            centerOnNode(best);
        }

        function getParents(nodeId) {
            const parentIds = parentIdsByNode.get(nodeId) || [];
            return parentIds.map(pid => nodeById.get(pid)).filter(Boolean);
        }

        function renderDetails(node) {
            const detail = document.getElementById("detail-content");
            if (!detail || !node) return;
            const parents = getParents(node.id);
            const parentSymbols = parents.map(p => p.symbol).join(", ");
            const childSymbols = node.children.map(cid => nodeById.get(cid)).filter(Boolean).map(c => c.symbol).join(", ");
            const startLine = findLineForByte(node.start_byte);
            const endLine = findLineForByte(node.end_byte);
            const lineInfo = startLine === null ? "N/A" : `${startLine + 1}-${(endLine ?? startLine) + 1}`;
            detail.textContent =
                `symbol: ${node.symbol}
` +
                `type: ${node.type}
` +
                `ctx: ${node.ctx}
` +
                `start_byte: ${node.start_byte}
` +
                `end_byte: ${node.end_byte}
` +
                `lines: ${lineInfo}
` +
                `children: ${node.children.length}
` +
                `parents: ${parents.length}
` +
                `parent_symbols: ${parentSymbols}
` +
                `child_symbols: ${childSymbols}`;
        }

        function centerOnNode(node) {
            if (!node) return;
            if (!graphContainer) return;
            const containerRect = graphContainer.getBoundingClientRect();
            const targetX = Math.max(node.x - containerRect.width / 2, 0);
            const targetY = Math.max(node.y - containerRect.height / 2, 0);
            graphContainer.scrollTo({ left: targetX, top: targetY, behavior: "smooth" });
        }

        function selectNode(node) {
            if (!node) return;

            highlightCodeForNode(node);

            updateGraphStyles();

        function computeLayout() {
            const depthMap = new Map();
            nodes.forEach(node => {
                const depth = Number.isFinite(node.depth) ? node.depth : 0;
                if (!depthMap.has(depth)) {
                    depthMap.set(depth, []);
                }
                depthMap.get(depth).push(node);
            });

            const orderByDepth = new Map();
            const queue = [...graphData.roots];
            const queued = new Set(queue);
            while (queue.length > 0) {
                const nodeId = queue.shift();
                const node = nodeById.get(nodeId);
                if (!node) continue;
                const depth = node.depth || 0;
                if (!orderByDepth.has(depth)) {
                    orderByDepth.set(depth, []);
                }
                if (!orderByDepth.get(depth).includes(node)) {
                    orderByDepth.get(depth).push(node);
                }
                node.children.forEach(childId => {
                    if (!queued.has(childId)) {
                        queue.push(childId);
                        queued.add(childId);
                    }
                });
            }

            const depths = Array.from(depthMap.keys()).sort((a, b) => a - b);
            const columnGap = 220;
            const rowGap = 60;
            const marginX = 80;
            const marginY = 60;
            let maxNodes = 0;

            depths.forEach(depth => {
                const level = [];
                const ordered = orderByDepth.get(depth) || [];
                ordered.forEach(node => level.push(node));

                const fallback = (depthMap.get(depth) || []).filter(node => !level.includes(node));
                fallback.sort((a, b) => {
                    const symA = (a.symbol || "").toLowerCase();
                    const symB = (b.symbol || "").toLowerCase();
                    if (symA < symB) return -1;
                    if (symA > symB) return 1;
                    return a.id - b.id;
                });
                fallback.forEach(node => level.push(node));

                maxNodes = Math.max(maxNodes, level.length);
                level.forEach((node, index) => {
                    node.x = marginX + depth * columnGap;
                    node.y = marginY + index * rowGap;
                });
            });

            if (depths.length === 0) {
                graphWidth = graphPanel ? graphPanel.clientWidth : window.innerWidth;
                graphHeight = graphPanel ? graphPanel.clientHeight : window.innerHeight;
                return;
            }

            const maxDepth = Math.max(...depths);
            graphWidth = marginX * 2 + (maxDepth + 1) * columnGap;
            graphHeight = marginY * 2 + Math.max(1, maxNodes) * rowGap;

            if (graphPanel) {
                graphWidth = Math.max(graphWidth, graphPanel.clientWidth);
                graphHeight = Math.max(graphHeight, graphPanel.clientHeight);
            }
        }

        function wireControls() {

                if (popFilter) filters.POP = popFilter.checked;
