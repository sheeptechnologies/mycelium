site_name: Mycelium
site_description: Tree-sitter-based stack graphs for semantic indexing.
site_author: Sheep Technologies
site_url: https://sheeptechnologies.github.io/mycelium/

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Stack Graphs Concepts: stack-graphs.md
  - Why Stack Graphs: why-stack-graphs.md
  - Language Support: language-support.md
  - Development: development.md

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - content.code.copy
  palette:
    # Palette toggle for dark mode
    - scheme: slate
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

    # Palette toggle for light mode
    - scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - codehilite
  - toc:
      permalink: true

plugins:
  - search
